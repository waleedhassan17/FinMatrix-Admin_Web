name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `build` runs `tsc -b` first, so this covers the type check too.
      - name: Build
        run: npm run build

      # Hard gate: no hex literals or hardcoded type outside the token files.
      - name: Design tokens
        run: npm run check:tokens

      - name: Tests
        run: npm test

      # Informational. Everything here is a warning today, mostly inherited
      # react-compiler notes; failing the build on them would cost more than
      # it catches.
      - name: Lint
        run: npm run lint
        continue-on-error: true
