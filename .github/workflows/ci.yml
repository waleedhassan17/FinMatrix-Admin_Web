name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `build` runs `tsc -b` first, so this covers the type check too.
      - name: Build
        run: npm run build

      # Hard gate: no hex literals or hardcoded type outside the token files.
      - name: Design tokens
        run: npm run check:tokens

      - name: Tests
        run: npm test

      # Informational, but no longer by much: 6 warnings, all inherited
      # react-compiler notes (fast-refresh export shapes, one set-state-in-
      # effect in ConfirmDialog, one incompatible-library on TanStack Table).
      #
      # The rule that matters already gates without this step:
      # react/exhaustive-effect-dependencies is "error" in .oxlintrc.json, and
      # oxlint exits non-zero on an error. It was added the day it caught the
      # sidebar drawer closing itself on the render that opened it -- the
      # console was unusable on a phone and nothing in CI noticed.
      #
      # Clear the six and this step can drop continue-on-error too.
      - name: Lint
        run: npm run lint
        continue-on-error: true
